# ---------------------------------------------------------------------------
# Valeurs par défaut pour l'import Alcatel
# ---------------------------------------------------------------------------
defaults:
  brand: "Alcatel-Lucent"
  category: "Téléphonie"
  job: "Telephonie"

# ---------------------------------------------------------------------------
# Valeurs par défaut pour l'import Unyc / Centrex
# ---------------------------------------------------------------------------
unyc_defaults:
  subcategory: "Téléphone IP"

# ---------------------------------------------------------------------------
# Mapping Interface Alcatel -> Sous-catégorie Bob! Desk (prioritaire)
# ---------------------------------------------------------------------------
interface_to_subcategory:
  "IP":  "Téléphone IP"
  "Z":   "Téléphone Analogique"
  "A":   "Téléphone Analogique"
  "UA":  "Téléphone Numérique"

# ---------------------------------------------------------------------------
# Mapping Type Alcatel -> Sous-catégorie Bob! Desk
# ---------------------------------------------------------------------------
type_to_subcategory:
  # Postes IP
  "4008":           "Téléphone IP"
  "4018":           "Téléphone IP"
  "4028":           "Téléphone IP"
  "4038":           "Téléphone IP"
  "4058":           "Téléphone IP"
  "4068":           "Téléphone IP"
  "8018":           "Téléphone IP"
  "8028":           "Téléphone IP"
  "8038":           "Téléphone IP"
  "8058":           "Téléphone IP"
  "8068":           "Téléphone IP"
  # Postes numériques (UA) — fallback si interface absente
  "4029":           "Téléphone Numérique"
  "4039":           "Téléphone Numérique"
  "8029":           "Téléphone Numérique"
  "8039":           "Téléphone Numérique"
  "8079":           "Téléphone Numérique"
  # Postes analogiques
  "Analogic":       "Téléphone Analogique"
  "Analog":         "Téléphone Analogique"
  # Modules d'extension (AOM) -> Module de touches
  "Add-On 10":      "Module de touches"
  "Add-On 40":      "Module de touches"
  "Add-On":         "Module de touches"
  # Terminaux virtuels / outils -> null si non mappable
  "Virtual Terminal":          null
  "IPDSP":                     "SoftPhone"
  "Remote Access V34":         null
  "Remote Access ISDN":        null
  "Internal Voice Mail Unit":  null
  "IVM":                       null

# ---------------------------------------------------------------------------
# Surcharge de catégorie par type Alcatel
# ---------------------------------------------------------------------------
alcatel_category_override:
  "Phone":  "Téléphonie"
  "AOM":    "Téléphonie"
  "Tool":   "Téléphonie"
  "Set":    "Téléphonie"

# ---------------------------------------------------------------------------
# Clés anti-doublon (dans l'ordre de priorité)
# ---------------------------------------------------------------------------
dedup_keys:
  - "serial"        # = Numéro matériel Alcatel (champ Bob! Desk: serial)
  - "mac_address"   # = ID Alcatel (champ personnalisé)
  - "edn"           # = EDN Alcatel (dans le nom de l'équipement)

# ---------------------------------------------------------------------------
# Conversion des noms de modèles Alcatel -> noms lisibles dans Bob! Desk
# Clé = regex sur la colonne Type, Valeur = nom affiché dans Bob! Desk
# ---------------------------------------------------------------------------
model_name_override:
  "^Add-On 10":        "Module de touches 10"
  "^Add-On 40":        "Module de touches 40"
  "^Add-On":           "Module de touches"
  "^Virtual Terminal": "Virtual Terminal"
  "^IPDSP":            "Alcatel SoftPhone"
  "^Analogic":         "Poste Analogique"
  "^Analog":           "Poste Analogique"

# ---------------------------------------------------------------------------
# Template de nom d'équipement
# ---------------------------------------------------------------------------
equipment_name_template: "{edn} - {model}"
